# tv: sway as a kiosk around one foot terminal on the HDMI output.
# render_bit_depth 6 = RGB565: kstb-drm has no XRGB8888, which wlroots
# picks otherwise (cage fails with "Failed to pick primary buffer format").
output * render_bit_depth 6
default_border none
default_floating_border none
seat * hide_cursor 3000
# the terminal; when its shell exits, sway exits and the console is back
exec "foot $TV_CMD; swaymsg exit"
# Ctrl+Alt+Return: another terminal (tiled), Ctrl+Alt+Backspace: leave
bindsym Ctrl+Mod1+Return exec foot
bindsym Ctrl+Mod1+BackSpace exit
bindsym Ctrl+Mod1+f fullscreen toggle
bindsym Ctrl+Mod1+q kill
