# The display supports opaque ARGB8888; Sway falls back from XRGB8888.
output * render_bit_depth 8
# Open one terminal when the desktop starts. Closing it leaves Sway running.
exec foot
# Launch desktop applications by name, with icons and a readable search menu.
set $menu wofi --show drun
unbindsym $mod+d
bindsym $mod+d exec $menu
